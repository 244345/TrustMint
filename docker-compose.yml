services:
  stellar:
    image: stellar/quickstart:latest
    # Match Soroban SDK 22 / JS SDK 13 so the RPC XDR stays in the supported range.
    command: ["--local", "--enable", "rpc", "--limits", "testnet", "--protocol-version", "22"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/soroban/rpc"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
