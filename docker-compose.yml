services:
  stellar:
    image: stellar/quickstart:latest
    # Use current local protocol metadata with Soroban-ready testnet resource limits.
    command: ["--local", "--enable", "rpc", "--limits", "testnet"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/soroban/rpc"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
